name = "lantern"
main = "worker/index.ts"
compatibility_date = "2026-10-01"
# The Claude connector fetches client metadata documents from URLs a client names;
# this keeps those fetches on the public internet.
compatibility_flags = ["global_fetch_strictly_public"]

# Production is only reachable through the custom domain, with private paths behind Access.
workers_dev = false
# Pull request Previews get a workers.dev link. Previews have no bindings or vars (see
# [previews] below), so the private API refuses every call there and no manuscript data
# is reachable. Turn on Cloudflare Access for Preview URLs in the dashboard to keep even
# the app shell private.
preview_urls = true

routes = [
  { pattern = "lantern.bkbuilds.dev", custom_domain = true }
]

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/mcp", "/authorize", "/oauth/*", "/.well-known/oauth-*"]

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "lantern-manuscripts"

[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "lantern-backups"

[[d1_databases]]
binding = "DB"
database_name = "lantern-db"
database_id = "084c5c28-3355-4ef9-89f9-f9eac612ea13"
migrations_dir = "migrations"

# OAuth grants and tokens for the Claude connector (hashed or encrypted at rest).
# The id is pinned so every deploy uses lantern-oauth-kv, even when the version
# being replaced has no KV binding (otherwise wrangler tries to create it again).
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "7ceeeaab8d2d40c2a8d39932cc51e86d"

[vars]
# Cloudflare Access identifiers (not secrets). The Worker verifies private API
# requests with these and refuses them if blank. Public review endpoints use link tokens.
ACCESS_TEAM_DOMAIN = "brendonking.cloudflareaccess.com"
ACCESS_AUD = "1e574ca60c92c7dc4f16d769c40c82f2b3636c2dcb0061e6248b2e27d077d2a3"

# Claude. The API key is a secret, set with `npx wrangler secret put ANTHROPIC_API_KEY`,
# never here. These limits apply to every call Lantern makes to Claude.
AI_MODEL = "claude-opus-5-5"
AI_DAILY_LIMIT = "30"          # calls in any 24 hours
AI_MONTHLY_BUDGET_USD = "10"   # estimated spend per calendar month (UTC)

# Claude connector: the only hosts it may send sign-in tokens to.
MCP_REDIRECT_HOSTS = "claude.ai,claude.com"

[triggers]
crons = ["17 3 * * *"]

# Workers Builds runs `wrangler preview` for pull request branches, which needs this block.
# Empty on purpose: Previews don't inherit the bindings above, so a Preview can't touch
# the real manuscripts, database or backups (its API calls won't work, but the UI builds).
[previews]
